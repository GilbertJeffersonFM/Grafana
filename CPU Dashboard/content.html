<div class="stats-grid">
  <div class="stat-panel" style="background-color: #73bf69;" data-metric="usage">
    <div class="stat-title">CPU Usage</div>
    <div class="stat-value">
      <span class="value">-</span>
      <span class="unit">cores</span>
    </div>
  </div>

  <div class="stat-panel" style="background-color: #f2cc0c;" data-metric="request">
    <div class="stat-title">CPU Request</div>
    <div class="stat-value">
      <span class="value">-</span>
      <span class="unit">cores</span>
    </div>
  </div>

  <div class="stat-panel" style="background-color: #5794f2;" data-metric="limits">
    <div class="stat-title">CPU Limits</div>
    <div class="stat-value">
      <span class="value">-</span>
      <span class="unit">cores</span>
    </div>
  </div>

  <div class="stat-panel" style="background-color: #e02f44;" data-metric="capacity">
    <div class="stat-title">CPU Capacity</div>
    <div class="stat-value">
      <span class="value">-</span>
      <span class="unit">cores</span>
    </div>
  </div>
</div>
